name: Build FlameVox VST3

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --target FlameVox_VST3

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: FlameVox-VST3
          path: build/FlameVox_artefacts/Release/VST3/FlameVox.vst3
